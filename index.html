<!DOCTYPE html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gestor de Tarefas</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-container">
      <div class="header">
        <h1>Minhas Tarefas</h1>
        <button class="btn-theme" id="themeToggleBtn">🌙 Escuro</button>
      </div>

      <div class="input-group">
        <input
          type="text"
          id="taskInput"
          placeholder="O que precisa de fazer?"
          autocomplete="off"
        />
        <input
          type="date"
          id="taskDate"
          title="Se deixar em branco, será atribuída a data de hoje."
        />
        <button class="btn-add" id="addTaskBtn">Adicionar</button>
      </div>

      <!-- Contentor dinâmico onde as tarefas agrupadas por data serão renderizadas -->
      <div id="pendingContainer"></div>

      <p class="empty-message" id="emptyMessage">
        Nenhuma tarefa registada. Adicione uma acima!
      </p>

      <!-- Secção de Tarefas Concluídas -->
      <div class="completed-section" id="completedSection">
        <h2 class="section-title">Concluídas</h2>
        <ul class="task-list" id="completedList">
          <!-- Renderizadas via JS -->
        </ul>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
